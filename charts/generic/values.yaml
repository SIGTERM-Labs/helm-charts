# Default values for generic.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Mode can be "deployment" (default), "stateful" (StatefulSet), "job" (one-time Job run on each deploy), or "cronjob" (scheduled CronJob)
mode: deployment

replicaCount: 1

# This is considered the primary container in the deployment
# Ingress/Service will point here
image:
  repository: nginx
  pullPolicy: IfNotPresent
  tag: latest

# sharedEmptyDirs will be shared between the main application container, sidecars, and initContainers
sharedEmptyDirs: []
#  - name: example-shared
#    mountPath: /var/shared

initContainers: []
#  - name: init-myservice
#    image: busybox:1.28
#    imagePullPolicy: IfNotPresent
#    command: ['sh', '-c', "until nslookup myservice.$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace).svc.cluster.local; do echo waiting for myservice; sleep 2; done"]
#    args: ['args', 'moreargs']
#  - name: init-mydb
#    image: busybox:1.28
#    imagePullPolicy: IfNotPresent

sidecars: []
#  - name: example-sidecar
#    image:
#      repository: nginx
#      pullPolicy: IfNotPresent
#      tag: latest
#    environment: {}
#      MY_KEY: "My Value"
#    secretEnvironment: {}
#      MY_KEY: "My Value"
#    ports:
#     - name: metrics
#       containerPort: 9101
#       protocol: TCP
#    command: ['sh', '-c', "until nslookup myservice.$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace).svc.cluster.local; do echo waiting for myservice; sleep 2; done"]
#    args: ['args', 'moreargs']

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
shortnameOverride: ""
instanceOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""
  clusterRoleRules: []
  roleRules: []

# Specifies whether to recreate Pods on a redeploy if nothing else about the underlying Pods changed.
# This is useful for Deployments that deploy an unchanging image tag like :latest,
# but still want the Pods to recreate to use the image pullPolicy to re-pull the image.
# This creates an annotation on the Pods with the current helm release number.
recreatePodsOnUpgrade: false

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

# When true, containers in the pod share a process namespace (needed for a sidecar
# to signal processes in another container, e.g. SIGTERM on leader demotion).
shareProcessNamespace: false

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# Configuration for the primary container - works for both deployment and stateful modes
# Note: "strategy" is only used for Deployment mode (StatefulSets don't support rolling update strategies)
deployment:
  containerPort: 80
  containerPortName: http
  command: [] # Optional, Equivalent of ENTRYPOINT
  args: [] # Optional, Equivalent of CMD
  additionalPorts: []
#    - name: metrics
#      containerPort: 9101
#      protocol: TCP
  # Environment variables to add directly to the container configuration (as opposed to via the secret or configmap)
  environment: {}
  #  MY_KEY: "My Value"
  # Secret environment variables to add ONLY to the main container (will not be shared with sidecars/init containers)
  secretEnvironment: {}
  #  MY_KEY: "My Value"
  livenessProbe: {}
#    httpGet:
#      path: /
#      port: http
  readinessProbe: {}
#    httpGet:
#      path: /
#      port: http
  startupProbe: {}
#    httpGet:
#      path: /
#      port: http
#    initialDelaySeconds: 0  # No delay before starting to check
#    periodSeconds: 10       # Check every 10 seconds
#    failureThreshold: 60    # Allows up to 60 consecutive failures (10 minutes)
  strategy:
    maxSurge: 25%
    maxUnavailable: 25%
    type: RollingUpdate
  lifecycle: {}

service:
  enabled: false
  type: ClusterIP
  loadBalancerClass: ""
  additionalLabels: {}
    # application: my-application
    # prometheus: application-metrics
  annotations: {}
    # external-dns.alpha.kubernetes.io/hostname: testing.example.com
  port: 80
  additionalPorts: []
  #    - port: 9101
  #      targetPort: 9101
  #      protocol: TCP
  #      name: metrics

# Sometimes, an additional service of a different type is needed
additionalServices: []
#  - name: service-name # If omitted, it will be named like the primary service, with an incrementing number
#    type: LoadBalancer
#    loadBalancerClass: ""
#    additionalLabels: {}
#    # application: my-application
#    # prometheus: application-metrics
#    additionalSelectorLabels: {}
#      # role: metrics
#    annotations: {}
#    # external-dns.alpha.kubernetes.io/hostname: testing.example.com
#    ports:
#     - port: 9101
#       targetPort: 9101
#       protocol: TCP
#       name: metrics

publish:
  enabled: false
  type: gateway # ingress | gateway

  hosts:
    - host: chart-example.local
      # paths defaults to a single "/" Prefix path when omitted
      paths:
        - path: /
          pathType: Prefix
          # port: 8080  # Optional: specify a custom port for this path, otherwise uses service.port

  tlsEnabled: true
  # Uncomment the following to use a pre-generated TLS Secret
  # tlsSecretName: ""

  ingress:
    className: ""
    annotations: {}
      # kubernetes.io/ingress.class: nginx
      # kubernetes.io/tls-acme: "true"
    # Switch between different Ingress rule styles. Can be one of "rules", or "defaultBackend"
    ruleType: "rules"
    # Set to false if TLS is enabled, but you're using an ingress class that doesn't support TLS cert secrets
    tlsSecretEnabled: true

  gateway:
    name: public
    namespace: envoy-gateway-system
    # Applied to the generated HTTPRoute only
    annotations: {}

    # Optional if using ListenerSet
    listenerSet:
      enabled: false
      # Applied to the generated ListenerSet only. Useful for cert-manager annotations
      # (e.g. cert-manager.io/cluster-issuer), since the ListenerSet is what holds the
      # TLS certificateRefs, not the HTTPRoute.
      annotations: {}

    # Because HTTPRoute rules are so extensible, it is complicated to generate a catch-all set of generic rules
    # from "hosts" above. This chart provides a minimal PathPrefix matcher and backendRef rule per host/path by
    # default, but rules can be defined here instead and are provided to the HTTPRoute as-is.
    # See the HTTPRoute documentation for configuration details: https://gateway-api.sigs.k8s.io/api-types/httproute/
    # rules: {}

# Contour-specific routing. Assumes the Contour ingress controller and its
# projectcontour.io/v1 HTTPProxy CRD are already installed in the cluster.
contour:
  httpProxy:
    enabled: false
    annotations: {}
    # The fully qualified domain name that this proxy answers for.
    fqdn: chart-example.local
    tls:
      enabled: true
      # Reuse a pre-existing TLS Secret. Defaults to "<release>-tls" (the same
      # default the ingress TLS block uses). Point a cert-manager Certificate
      # (see "certificates" below) at this secretName to have it auto-populated.
      # secretName: ""
      # Terminate TLS at Contour (default) or pass encrypted traffic straight
      # through to the backend. When passthrough is true, secretName is ignored
      # and Contour routes at L4: the chart emits a default "tcpproxy" to the
      # Service (not HTTP "routes"). Override with tcpproxy below if needed.
      passthrough: false
      # minimumProtocolVersion: "1.2"
    # Extra HTTPProxy "includes" (delegated routing), passed through as-is.
    # includes: []
    # By default a single route sends all traffic ("/") to the chart's Service
    # on service.port (or, when tls.passthrough is true, a tcpproxy to it).
    # Provide routes here to override with your own, passed to the HTTPProxy
    # as-is. See https://projectcontour.io/docs/main/config/api/
    # routes: []
    # L4 TCP proxying, passed through as-is. Used for TLS passthrough (and takes
    # precedence over the generated default). Mutually exclusive with routes.
    # tcpproxy: {}

# cert-manager Certificate resources (cert-manager.io/v1).
# Each entry creates one Certificate. The full Certificate spec is passed through
# as-is, so any field supported by cert-manager can be set here.
# See: https://cert-manager.io/docs/usage/certificate/
#
# NOTE: when defining more than one certificate, set an explicit "name" on each.
# Unnamed entries fall back to "<fullname>-<index>", which is position-sensitive:
# reordering the list would rename the Certificate, causing cert-manager to prune
# and reissue it. An explicit name keeps the resource identity stable.
certificates: []
#  - # Optional, but recommended (required for stable names when >1 cert).
#    # Defaults to the chart fullname (with an index suffix if multiple).
#    name: ""
#    annotations: {}
#    additionalLabels: {}
#    # The Certificate spec — passed through to the resource as-is.
#    spec:
#      secretName: chart-example-tls
#      commonName: chart-example.local
#      dnsNames:
#        - chart-example.local
#        - www.chart-example.local
#      issuerRef:
#        name: letsencrypt
#        kind: ClusterIssuer
#        group: cert-manager.io
#      # duration: 2160h
#      # renewBefore: 360h
#      # usages:
#      #   - server auth
#      #   - client auth

networkPolicy:
  enabled: false
  policyTypes: []
