{{- if .Values.publish.enabled -}}
{{- if not (has .Values.publish.type (list "ingress" "gateway")) }}
{{- fail (printf "publish.type must be \"ingress\" or \"gateway\" (got %q)" .Values.publish.type) }}
{{- end }}
{{- end }}
{{- if and .Values.publish.enabled (eq .Values.publish.type "ingress") -}}
{{- $fullName := include "generic.fullname" . -}}
{{- $svcPort := .Values.service.port -}}
{{- $annotations := .Values.publish.ingress.annotations -}}
{{- if and .Values.publish.ingress.className (not (semverCompare ">=1.18-0" .Capabilities.KubeVersion.GitVersion)) }}
  {{- if not (hasKey $annotations "kubernetes.io/ingress.class") }}
  {{- $_ := set $annotations "kubernetes.io/ingress.class" .Values.publish.ingress.className }}
  {{- end }}
{{- end }}
{{- if semverCompare ">=1.19-0" .Capabilities.KubeVersion.GitVersion -}}
apiVersion: networking.k8s.io/v1
{{- else if semverCompare ">=1.14-0" .Capabilities.KubeVersion.GitVersion -}}
apiVersion: networking.k8s.io/v1beta1
{{- else -}}
apiVersion: extensions/v1beta1
{{- end }}
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "generic.labels" . | nindent 4 }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if and .Values.publish.ingress.className (semverCompare ">=1.18-0" .Capabilities.KubeVersion.GitVersion) }}
  ingressClassName: {{ .Values.publish.ingress.className }}
  {{- end }}
  {{- if .Values.publish.tlsEnabled }}
  tls:
    - hosts:
      {{- range .Values.publish.hosts }}
        - {{ .host | quote }}
      {{- end }}
      {{- if .Values.publish.ingress.tlsSecretEnabled }}
      secretName: "{{ .Values.publish.tlsSecretName | default (printf "%s-tls" .Release.Name) }}"
      {{- end }}
  {{- end }}
  {{- if eq $.Values.publish.ingress.ruleType "rules" }}
  rules:
    {{- range .Values.publish.hosts }}
    {{- $paths := default (list (dict "path" "/" "pathType" "Prefix")) .paths }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range $paths }}
          - path: {{ .path }}
            {{- if and .pathType (semverCompare ">=1.18-0" $.Capabilities.KubeVersion.GitVersion) }}
            pathType: {{ .pathType }}
            {{- end }}
            backend:
              {{- if semverCompare ">=1.19-0" $.Capabilities.KubeVersion.GitVersion }}
              service:
                name: {{ $fullName }}
                port:
                  number: {{ .port | default $svcPort }}
              {{- else }}
              serviceName: {{ $fullName }}
              servicePort: {{ .port | default $svcPort }}
              {{- end }}
          {{- end }}
    {{- end }}
  {{- else if eq $.Values.publish.ingress.ruleType "defaultBackend" }}
  defaultBackend:
    service:
      name: {{ $fullName }}
      port:
        number: {{ $svcPort }}
  {{- end }}
{{- end }}
