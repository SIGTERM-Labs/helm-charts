{{- if and .Values.alertmanager.enabled .Values.alertmanager.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "prometheus-operator.alertmanager.serviceAccountName" . }}
  labels:
    {{- include "prometheus-operator.alertmanager.labels" . | nindent 4 }}
  {{- with .Values.alertmanager.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.alertmanager.serviceAccount.automountServiceAccountToken }}
{{- if .Values.alertmanager.serviceAccount.clusterRoleRules }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "prometheus-operator.fullname" . }}-alertmanager
  labels:
    {{- include "prometheus-operator.alertmanager.labels" . | nindent 4 }}
rules:
  {{- toYaml .Values.alertmanager.serviceAccount.clusterRoleRules | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "prometheus-operator.fullname" . }}-alertmanager
  labels:
    {{- include "prometheus-operator.alertmanager.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "prometheus-operator.fullname" . }}-alertmanager
subjects:
  - kind: ServiceAccount
    name: {{ include "prometheus-operator.alertmanager.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- if .Values.alertmanager.serviceAccount.roleRules }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "prometheus-operator.fullname" . }}-alertmanager
  labels:
    {{- include "prometheus-operator.alertmanager.labels" . | nindent 4 }}
rules:
  {{- toYaml .Values.alertmanager.serviceAccount.roleRules | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "prometheus-operator.fullname" . }}-alertmanager
  labels:
    {{- include "prometheus-operator.alertmanager.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "prometheus-operator.fullname" . }}-alertmanager
subjects:
  - kind: ServiceAccount
    name: {{ include "prometheus-operator.alertmanager.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
